server {
    listen 80;
    listen [::]:80;
    server_name web.98.81.182.132.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }
    location / {
        return 301 https://web.98.81.182.132.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name web.98.81.182.132.sslip.io;
    root /var/www/caba-night-web/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/caba-night-web/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caba-night-web/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location = /release.json {
        add_header Cache-Control "no-store" always;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(?:webp|png|jpg|jpeg|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
