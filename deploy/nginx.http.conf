# Bootstrap only: obtain the certificate before switching to nginx.https.conf.
server {
    listen 80;
    listen [::]:80;
    server_name web.98.81.182.132.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }
    location / {
        return 503;
    }
}
